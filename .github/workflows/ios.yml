name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "--- available Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodegen --version
          sw_vers

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DSHiOS.xcodeproj \
            -scheme DSHiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DSH-iOS-unsigned.ipa Payload
          ls -lh DSH-iOS-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/*.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/*.app/Info.plist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-iOS-ipa
          path: DSH-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" DSH-iOS-unsigned.ipa \
            --title "DSH iOS unsigned build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic unsigned IPA build. Commit: ${GITHUB_SHA}" \
            || gh release upload "$TAG" DSH-iOS-unsigned.ipa --clobber

  test:
    name: Functional tests (simulator)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator (iOS >= 16.2)
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c "
import json, sys
data = json.load(sys.stdin)
best = None
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime: continue
    version = runtime.split('iOS-')[-1].replace('-', '.')
    try:
        parts = tuple(int(p) for p in version.split('.')[:2])
    except ValueError:
        continue
    if parts < (16, 2): continue
    for device in devices:
        if device.get('isAvailable') and 'iPhone' in device['name']:
            if best is None or parts > best[0]:
                best = (parts, device['udid'], device['name'], version)
if best is None:
    sys.exit('no suitable simulator found')
print(best[1])
print(f\"selected: {best[2]} iOS {best[3]} ({best[1]})\", file=sys.stderr)
")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator UDID: $UDID"

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DSHiOS.xcodeproj \
            -scheme DSHiOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath sim-build \
            -resultBundlePath TestResults.xcresult

      - name: Collect screenshots
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p screenshots
          find "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Containers/Data/Application" \
            -name "*.png" -path "*Documents*" -exec cp {} screenshots/ \; 2>/dev/null || true
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: warn
