name: DSHiOS
options:
  bundleIdPrefix: com.dshdesktop
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    PRODUCT_MODULE_NAME: DSHiOS

targets:
  DSHiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios
        PRODUCT_NAME: DSH
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DSHiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: DSHiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios.unittests
        GENERATE_INFOPLIST_FILE: YES

  DSHiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: DSHiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DSHiOS

schemes:
  DSHiOS:
    build:
      targets:
        DSHiOS: all
        DSHiOSTests: [test]
        DSHiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DSHiOSTests
        - DSHiOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release