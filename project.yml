name: DSHiOS
options:
  bundleIdPrefix: com.dshdesktop
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.7"
    # CI 打包时会用 run 序号覆盖（见 .github/workflows/ios.yml），使应用内版本号与 release 编号一致
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  # SSH 客户端（纯 Swift，iOS 14+；0.9.2 起修复了新版编译器下的 defer/await 编译错误）
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.9.2
  # Citadel 的底层依赖（读取 ByteBuffer 需要 NIOCore）
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: "2.65.0"

targets:
  DSHiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: Citadel
        product: Citadel
      - package: swift-nio
        product: NIOCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios
        PRODUCT_NAME: DSH
        PRODUCT_MODULE_NAME: DSHiOS
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DSHiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: DSHiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios.unittests
        GENERATE_INFOPLIST_FILE: YES
        # 应用产物名为 DSH.app（PRODUCT_NAME=DSH），需显式指定测试宿主
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSH.app/DSH"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DSHiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: DSHiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshdesktop.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DSHiOS

schemes:
  DSHiOS:
    build:
      targets:
        DSHiOS: all
        DSHiOSTests: [test]
        DSHiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DSHiOSTests
        - DSHiOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release